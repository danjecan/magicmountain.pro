name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # Picks up Notion Hikes edits (new dates, places left, a hike marked Past)
    # even when nobody pushes to the repo. Adjust the cadence to taste.
    - cron: "0 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
          GAS_SIGNUP_URL: ${{ vars.GAS_SIGNUP_URL }}
          GAS_HONEYPOT_FIELD: ${{ vars.GAS_HONEYPOT_FIELD }}
          MAILCHIMP_ACTION_URL: ${{ vars.MAILCHIMP_ACTION_URL }}
          MAILCHIMP_U: ${{ vars.MAILCHIMP_U }}
          MAILCHIMP_LIST_ID: ${{ vars.MAILCHIMP_LIST_ID }}
        run: python3 src/build.py --out dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
